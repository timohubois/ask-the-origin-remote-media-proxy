name: Commit Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
      - name: Validate Composer files
        run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer php:lint

  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        timber: ['^1.0', '^2.0']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: gd, imagick, mysqli
          tools: composer:v2, wp-cli
      - name: Install isolated Timber dependency
        env:
          TIMBER_CONSTRAINT: ${{ matrix.timber }}
        run: |
          mkdir -p "$RUNNER_TEMP/timber"
          if [ "$TIMBER_CONSTRAINT" = '^1.0' ]; then
            # Legacy compatibility fixture only; no production or global Composer changes.
            composer init --working-dir="$RUNNER_TEMP/timber" --name=ask-the-origin/legacy-fixture --no-interaction
            composer config --working-dir="$RUNNER_TEMP/timber" allow-plugins.composer/installers false
            composer config --working-dir="$RUNNER_TEMP/timber" --json policy.advisories.ignore \
              '{"twig/twig":{"constraint":"^1.0 || ^2.0","reason":"Legacy Timber 1 compatibility fixture only; never shipped with the plugin."}}'
          fi
          composer require --working-dir="$RUNNER_TEMP/timber" "timber/timber:$TIMBER_CONSTRAINT" --no-interaction --prefer-dist
          composer show --working-dir="$RUNNER_TEMP/timber" timber/timber
      - name: Report legacy dependency advisories
        if: matrix.timber == '^1.0'
        run: |
          echo '::warning::Timber 1 requires vulnerable legacy Twig. The exception is confined to this disposable test job.'
          # Ignored Twig advisories remain visible; other security advisories still fail.
          # Abandoned legacy packages are reported, not treated as security-test failures.
          composer audit --working-dir="$RUNNER_TEMP/timber" --format=plain --abandoned=report
      - name: Install disposable WordPress
        run: |
          wp core download --path="$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --url=http://ato.test --title=Tests --admin_user=test --admin_password=test-only-password --admin_email=test@example.test --skip-email
          mkdir -p wp-content/mu-plugins
          printf '%s\n' \
            '<?php' \
            "require \"$RUNNER_TEMP/timber/vendor/autoload.php\";" \
            'if (is_callable([\Timber\Timber::class, "init"])) {' \
            '    \Timber\Timber::init();' \
            '} else {' \
            '    new \Timber\Timber();' \
            '}' > wp-content/mu-plugins/timber.php
          ln -s "$GITHUB_WORKSPACE" wp-content/plugins/ask-the-origin-remote-media-proxy
          wp plugin activate ask-the-origin-remote-media-proxy
          wp rewrite structure '/%postname%/'
      - name: Run integration checks
        run: wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/tests/integration.php"
      - name: Check toolbar menu and toggle requests
        run: wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/tests/admin-bar.php"
      - name: Check Multisite routing and toolbar activation modes
        run: |
          cd "$RUNNER_TEMP/site"
          wp plugin deactivate ask-the-origin-remote-media-proxy
          wp core multisite-convert --base=/
          wp plugin activate ask-the-origin-remote-media-proxy --network
          wp eval-file "$GITHUB_WORKSPACE/tests/multisite.php"
          wp eval-file "$GITHUB_WORKSPACE/tests/admin-bar.php"
          wp --exec='define("WP_NETWORK_ADMIN", true);' eval-file "$GITHUB_WORKSPACE/tests/admin-bar.php"
          wp plugin deactivate ask-the-origin-remote-media-proxy --network
          wp plugin activate ask-the-origin-remote-media-proxy
          wp eval-file "$GITHUB_WORKSPACE/tests/admin-bar.php"

  plugin-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release directory
        run: |
          mkdir -p "$RUNNER_TEMP/ask-the-origin-remote-media-proxy"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/ask-the-origin-remote-media-proxy/"
      - uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ runner.temp }}/ask-the-origin-remote-media-proxy
          slug: ask-the-origin-remote-media-proxy
          strict: true
